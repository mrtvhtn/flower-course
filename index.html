<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удивительный мир растений — Интерактивный курс</title>
  <style>
    body { margin: 0; padding: 18px; background: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .langs { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .langs button { padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 20px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; cursor: pointer; }
    .langs button.active { background: #22c55e; color: #0f172a; border-color: #22c55e; }
    h1 { text-align: center; color: #4ade80; font-size: 24px; margin: 0 0 8px; }
    .sub { text-align: center; color: #cbd5e1; font-size: 15px; margin: 0 0 22px; line-height: 1.4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card { display: block; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; text-decoration: none; color: #f8fafc; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { transform: translateY(-2px); border-color: #4ade80; }
    .num { display: inline-block; background: #0f172a; color: #38bdf8; font-size: 12px; font-weight: bold; padding: 4px 9px; border-radius: 8px; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: bold; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="langs">
      <button id="l-ru" class="active" onclick="setLang('ru')">🇷🇺 Русский</button>
      <button id="l-fr" onclick="setLang('fr')">🇫🇷 Français</button>
      <button id="l-en" onclick="setLang('en')">🇬🇧 English</button>
    </div>
    <h1 id="main-title">🌿 Удивительный мир растений</h1>
    <p class="sub" id="main-sub">Выбери интерактивный урок, нажимай на кнопки внутри и наблюдай за секретами природы!</p>
    <div class="grid" id="cards"></div>
  </div>

<script>
  const UI = {
    ru: {
      title: '🌿 Удивительный мир растений',
      sub: 'Выбери интерактивный урок, нажимай на кнопки внутри и наблюдай за секретами природы!',
      lesson: 'Урок',
      items: [
        '🌸 Строение цветка и опыление',
        '🌱 Прорастание семени и фотосинтез',
        '💧 Как пьют деревья и кактусы',
        '🐝 Опыление: пчёлы и колибри',
        '🍂 Листопад и смена времён года',
        '🪷 Лотос и Кувшинка на воде',
        '🌴 Мангровые деревья и Баобаб',
        '💥 Бешеный огурец и Недотрога',
        '🪤 Венерина мухоловка и Росянка',
        '🌲 Секвойя и Банксия: семена огня',
        '🌻 Подсолнух и Мимоза стыдливая',
        '🍄 Микориза: подземная сеть леса',
        '🌙 Царица ночи и ночные опылители',
        '🪂 Одуванчик и планер Альсомитры',
        '🪨 Литопсы: живые камни пустыни'
      ]
    },
    fr: {
      title: '🌿 Le Monde Merveilleux des Plantes',
      sub: 'Choisis une leçon interactive, appuie sur les boutons et découvre les secrets de la nature !',
      lesson: 'Leçon',
      items: [
        '🌸 Structure de la fleur et pollinisation',
        '🌱 Germination et photosynthèse',
        '💧 Comment boivent les arbres et cactus',
        '🐝 Pollinisation : abeilles et colibris',
        '🍂 Chute des feuilles et saisons',
        '🪷 Lotus et Nénuphar sur l’eau',
        '🌴 Palétuviers et Baobab',
        '💥 Concombre d’âne et Balsamine',
        '🪤 Dionée attrape-mouche et Rossolis',
        '🌲 Séquoia et Banksia : graines du feu',
        '🌻 Tournesol et Mimosa pudique',
        '🍄 Mycorhize : le réseau de la forêt',
        '🌙 Reine de la Nuit et papillons',
        '🪂 Pissenlit et planeur Alsomitra',
        '🪨 Lithops : les pierres vivantes'
      ]
    },
    en: {
      title: '🌿 The Amazing World of Plants',
      sub: 'Pick an interactive lesson, tap the buttons inside, and explore nature’s secrets!',
      lesson: 'Lesson',
      items: [
        '🌸 Flower Structure & Pollination',
        '🌱 Seed Germination & Photosynthesis',
        '💧 How Trees & Cacti Drink Water',
        '🐝 Pollination: Bees & Hummingbirds',
        '🍂 Autumn Leaves & Changing Seasons',
        '🪷 Lotus & Water Lily on Water',
        '🌴 Mangrove Trees & Baobab',
        '💥 Squirting Cucumber & Touch-Me-Not',
        '🪤 Venus Flytrap & Sundew',
        '🌲 Sequoia & Banksia: Fire Seeds',
        '🌻 Sunflower & Sensitive Mimosa',
        '🍄 Mycorrhiza: Forest Underground Web',
        '🌙 Queen of the Night & Night Moths',
        '🪂 Dandelion & Alsomitra Glider',
        '🪨 Lithops: Living Desert Stones'
      ]
    }
  };

  let lang = 'ru';

  function render() {
    const data = UI[lang];
    document.getElementById('main-title').innerText = data.title;
    document.getElementById('main-sub').innerText = data.sub;
    const box = document.getElementById('cards');
    box.innerHTML = '';
    data.items.forEach((name, idx) => {
      const n = idx + 1;
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `lesson${n}.html`;
      a.innerHTML = `<div class="num">${data.lesson} ${n}</div><div class="card-title">${name}</div>`;
      box.appendChild(a);
    });
  }

  function setLang(l) {
    lang = l;
    ['ru','fr','en'].forEach(k => document.getElementById('l-'+k).className = (k===l?'active':''));
    render();
  }

  render();
</script>
</body>
</html>
