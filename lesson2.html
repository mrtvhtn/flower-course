<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leçon 2 — Les alchimistes vivants qui sculptent le granit</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(180deg, #f2f6fa 0%, #eef7f1 100%); color: #2c3e50; margin: 0; padding: 20px; }
  .container { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .back-btn { text-decoration: none; color: #5b6e7a; font-weight: 600; background: #f0f4f8; padding: 8px 16px; border-radius: 20px; }
  .lang-btns button { border: none; background: #f0f4f8; padding: 8px 14px; border-radius: 16px; cursor: pointer; font-weight: 700; margin-left: 4px; }
  .lang-btns button.active { background: #0d6efd; color: #fff; }
  h1 { color: #1b6ca8; font-size: 1.8rem; margin-bottom: 10px; }
  .story { font-size: 1.12rem; line-height: 1.65; background: #f4f9ff; padding: 18px; border-radius: 16px; border-left: 5px solid #0d6efd; }
  .lab-box { margin-top: 24px; background: #f8fafc; border-radius: 20px; padding: 20px; text-align: center; border: 2px dashed #90b8d8; }
  svg { max-width: 100%; height: 260px; }
  .action-btn { background: linear-gradient(135deg, #0d6efd, #3b82f6); color: white; border: none; padding: 14px 26px; font-size: 1.05rem; font-weight: 700; border-radius: 30px; cursor: pointer; margin: 6px; box-shadow: 0 6px 18px rgba(13,110,253,0.28); }
  .happy-msg { margin-top: 14px; font-size: 1.15rem; font-weight: 700; color: #198754; min-height: 30px; }
  @keyframes wiggle { 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-5deg);} 75%{transform:rotate(5deg);} }
  .happy-dance { animation: wiggle 0.7s ease infinite; transform-origin: 200px 145px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn" id="backTxt">← Retour au cours</a>
    <div class="lang-btns">
      <button onclick="setLang('fr')" id="btn-fr" class="active">FR</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
      <button onclick="setLang('ru')" id="btn-ru">RU</button>
    </div>
  </div>

  <h1 id="title">Leçon 2 : Les alchimistes vivants qui sculptent le granit</h1>
  <div class="story" id="story"></div>

  <div class="lab-box">
    <h3 id="labTitle">Expérience : Verse une goutte d'élixir de Saxifrage sur le rocher !</h3>
    <svg viewBox="0 0 400 250">
      <!-- Скала -->
      <polygon points="60,240 120,145 280,145 340,240" fill="#8d99ae"/>
      <!-- Трещинка в камне -->
      <path id="crack" d="M 200 145 L 200 145" stroke="#4a3728" stroke-width="5" stroke-linecap="round"/>
      <!-- Капля эликсира -->
      <circle id="drop" cx="200" cy="138" r="0" fill="#38bdf8"/>
      <!-- Камнеломка с живым личиком -->
      <g id="saxifrage">
        <ellipse cx="200" cy="140" rx="34" ry="12" fill="#2b9348"/>
        <line x1="200" y1="132" x2="200" y2="85" stroke="#55a630" stroke-width="5"/>
        <circle cx="200" cy="75" r="22" fill="#fff0f6" stroke="#f783ac" stroke-width="3"/>
        <circle cx="193" cy="72" r="2.5" fill="#2c3e50"/>
        <path id="eyeR" d="M 204 72 L 209 72" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>
        <path id="smile" d="M 194 80 Q 200 84 206 80" stroke="#e64980" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <div>
      <button class="action-btn" onclick="dissolveRock()" id="chemBtn">💧 Goutte d'élixir magique !</button>
      <button class="action-btn" style="background:#6c757d;" onclick="resetRock()" id="resetBtn">↺ Recommencer</button>
    </div>
    <div class="happy-msg" id="msg"></div>
  </div>
</div>

<script>
const data = {
  fr: {
    back: "← Retour au cours",
    title: "Leçon 2 : Les alchimistes vivants qui sculptent le granit",
    story: "Comment une petite fleur peut-elle pousser sur un rocher tout dur ? La <b>Saxifrage</b> (son nom signifie « perce-pierre ») est une vraie chimiste : ses racines fabriquent un élixir naturel doux qui creuse lentement un petit nid douillet dans la roche !",
    labTitle: "Expérience : Aide la Saxifrage à creuser son nid dans la roche !",
    chemBtn: "💧 Verser l'élixir naturel !",
    resetBtn: "↺ Recommencer",
    done: "Bravo ! La Saxifrage fait un clin d'œil : ses racines sont bien installées dans le rocher !"
  },
  en: {
    back: "← Back to course",
    title: "Lesson 2: Living Alchemists Sculpting Granite",
    story: "How can a tiny flower grow on solid rock? <b>Saxifrage</b> (whose name means 'rock-breaker') is a natural chemist: its roots release a gentle organic elixir that slowly carves a cozy cradle right inside the stone!",
    labTitle: "Experiment: Help Saxifrage carve a cozy nest in the rock!",
    chemBtn: "💧 Drop natural elixir!",
    resetBtn: "↺ Reset",
    done: "Hooray! Saxifrage winks happily: its roots have found a cozy home in the stone!"
  },
  ru: {
    back: "← Назад к курсу",
    title: "Урок 2: Живые алхимики, растворяющие гранит",
    story: "Как нежный цветок может вырасти прямо на твёрдой скале? <b>Камнеломка</b> — настоящий природный алхимик: её корешки выделяют особый природный эликсир, который по капле протачивает в камне уютную колыбельку для корней!",
    labTitle: "Опыт: Помоги камнеломке сделать уютное гнездышко в скале!",
    chemBtn: "💧 Капнуть природный эликсир!",
    resetBtn: "↺ Сначала",
    done: "Ура! Камнеломка весело подмигивает: её корешки уютно устроились прямо в скале!"
  }
};
let cur = 'fr';
function setLang(l) {
  cur = l;
  document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+l).classList.add('active');
  document.getElementById('backTxt').innerText = data[l].back;
  document.getElementById('title').innerText = data[l].title;
  document.getElementById('story').innerHTML = data[l].story;
  document.getElementById('labTitle').innerText = data[l].labTitle;
  document.getElementById('chemBtn').innerText = data[l].chemBtn;
  document.getElementById('resetBtn').innerText = data[l].resetBtn;
  if(document.getElementById('msg').innerText) document.getElementById('msg').innerText = data[l].done;
}
function dissolveRock() {
  document.getElementById('drop').setAttribute('r', '7');
  document.getElementById('crack').setAttribute('d', 'M 200 145 L 194 175 L 206 198 L 198 220');
  document.getElementById('smile').setAttribute('d', 'M 192 78 Q 200 89 208 78');
  document.getElementById('saxifrage').classList.add('happy-dance');
  document.getElementById('msg').innerText = data[cur].done;
}
function resetRock() {
  document.getElementById('drop').setAttribute('r', '0');
  document.getElementById('crack').setAttribute('d', 'M 200 145 L 200 145');
  document.getElementById('smile').setAttribute('d', 'M 194 80 Q 200 84 206 80');
  document.getElementById('saxifrage').classList.remove('happy-dance');
  document.getElementById('msg').innerText = '';
}
setLang('fr');
</script>
</body>
</html>
