<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leçon 3 — Citernes d'eau et armure de cire</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(180deg, #eef9f2 0%, #e6f4fa 100%); color: #2c3e50; margin: 0; padding: 20px; }
  .container { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .back-btn { text-decoration: none; color: #5b6e7a; font-weight: 600; background: #f0f4f8; padding: 8px 16px; border-radius: 20px; }
  .lang-btns button { border: none; background: #f0f4f8; padding: 8px 14px; border-radius: 16px; cursor: pointer; font-weight: 700; margin-left: 4px; }
  .lang-btns button.active { background: #198754; color: #fff; }
  h1 { color: #157347; font-size: 1.8rem; margin-bottom: 10px; }
  .story { font-size: 1.12rem; line-height: 1.65; background: #f0fdf4; padding: 18px; border-radius: 16px; border-left: 5px solid #198754; }
  .lab-box { margin-top: 24px; background: #f4fbf9; border-radius: 20px; padding: 20px; text-align: center; border: 2px dashed #68b893; }
  svg { max-width: 100%; height: 260px; }
  .action-btn { background: linear-gradient(135deg, #198754, #20c997); color: white; border: none; padding: 14px 26px; font-size: 1.05rem; font-weight: 700; border-radius: 30px; cursor: pointer; margin: 6px; box-shadow: 0 6px 18px rgba(25,135,84,0.28); }
  .happy-msg { margin-top: 14px; font-size: 1.15rem; font-weight: 700; color: #0d6efd; min-height: 30px; }
  @keyframes stretchJoy { 0%,100%{transform:scale(1,1);} 50%{transform:scale(1.12, 1.15);} }
  .plump-joy { animation: stretchJoy 0.9s ease infinite; transform-origin: 200px 200px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn" id="backTxt">← Retour au cours</a>
    <div class="lang-btns">
      <button onclick="setLang('fr')" id="btn-fr" class="active">FR</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
      <button onclick="setLang('ru')" id="btn-ru">RU</button>
    </div>
  </div>

  <h1 id="title">Leçon 3 : Citernes d'eau et armure de cire</h1>
  <div class="story" id="story"></div>

  <div class="lab-box">
    <h3 id="labTitle">Expérience : Remplis les feuilles-gourdes de la Joubarbe !</h3>
    <svg viewBox="0 0 400 250">
      <!-- Облачко и капли -->
      <text x="200" y="45" font-size="36" text-anchor="middle">☁️</text>
      <text id="rain" x="200" y="85" font-size="22" text-anchor="middle" opacity="0">💧 💧 💧</text>
      <!-- Земля -->
      <rect x="40" y="205" width="320" height="35" rx="12" fill="#8d6e63"/>
      <!-- Молодило-бочонок с живыми глазками -->
      <g id="joubarbe">
        <ellipse cx="145" cy="185" rx="36" ry="18" transform="rotate(-25 145 185)" fill="#52b788"/>
        <ellipse cx="255" cy="185" rx="36" ry="18" transform="rotate(25 255 185)" fill="#52b788"/>
        <ellipse cx="172" cy="168" rx="28" ry="22" transform="rotate(-12 172 168)" fill="#74c69d"/>
        <ellipse cx="228" cy="168" rx="28" ry="22" transform="rotate(12 228 168)" fill="#74c69d"/>
        <ellipse cx="200" cy="165" rx="26" ry="28" fill="#95d5b2"/>
        <!-- Счастливое личико -->
        <circle cx="192" cy="162" r="2.8" fill="#1b4332"/>
        <circle cx="208" cy="162" r="2.8" fill="#1b4332"/>
        <path id="jsmile" d="M 194 170 Q 200 174 206 170" stroke="#1b4332" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <div>
      <button class="action-btn" onclick="waterPlant()" id="rainBtn">🌧️ Faire pleuvoir !</button>
      <button class="action-btn" style="background:#6c757d;" onclick="resetPlant()" id="resetBtn">↺ Recommencer</button>
    </div>
    <div class="happy-msg" id="msg"></div>
  </div>
</div>

<script>
const data = {
  fr: {
    back: "← Retour au cours",
    title: "Leçon 3 : Citernes d'eau et armure de cire",
    story: "Sur les rochers brûlants, la <b>Joubarbe</b> (Sempervivum) transforme ses feuilles en petites gourdes bien rondes ! Recouvertes d'une fine armure de cire, elles gardent chaque goutte de pluie pendant des semaines.",
    labTitle: "Expérience : Arrose la Joubarbe pour remplir ses réservoirs !",
    rainBtn: "🌧️ Verser une pluie fraîche !",
    resetBtn: "↺ Recommencer",
    done: "Miam ! La Joubarbe s'étire de bonheur : toutes ses feuilles-gourdes sont pleines d'eau fraîche !"
  },
  en: {
    back: "← Back to course",
    title: "Lesson 3: Water Tanks & Wax Armor",
    story: "On sun-baked rocks, the <b>Houseleek</b> (Sempervivum) turns its leaves into plump little water canteens! Coated in a fine wax armor, they store every drop of rain for weeks.",
    labTitle: "Experiment: Water the Houseleek to fill its tanks!",
    rainBtn: "🌧️ Pour fresh rain!",
    resetBtn: "↺ Reset",
    done: "Yum! The Houseleek stretches happily: all its leaf-canteens are full of fresh water!"
  },
  ru: {
    back: "← Назад к курсу",
    title: "Урок 3: Водяные цистерны и восковая броня",
    story: "На горячих скалах <b>Молодило</b> превращает свои толстые листики в настоящие пухлые фляжки с водой! Покрытые тонкой восковой бронёй, они бережно хранят каждую каплю дождя неделями.",
    labTitle: "Опыт: Полей молодило из тучки, чтобы наполнить его листики-бочонки!",
    rainBtn: "🌧️ Полить дождиком!",
    resetBtn: "↺ Сначала",
    done: "Как вкусно! Молодило довольно потягивается: все его листики-бочонки полны прохладной воды!"
  }
};
let cur = 'fr';
function setLang(l) {
  cur = l;
  document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+l).classList.add('active');
  document.getElementById('backTxt').innerText = data[l].back;
  document.getElementById('title').innerText = data[l].title;
  document.getElementById('story').innerHTML = data[l].story;
  document.getElementById('labTitle').innerText = data[l].labTitle;
  document.getElementById('rainBtn').innerText = data[l].rainBtn;
  document.getElementById('resetBtn').innerText = data[l].resetBtn;
  if(document.getElementById('msg').innerText) document.getElementById('msg').innerText = data[l].done;
}
function waterPlant() {
  document.getElementById('rain').setAttribute('opacity', '1');
  document.getElementById('jsmile').setAttribute('d', 'M 191 168 Q 200 180 209 168');
  document.getElementById('joubarbe').classList.add('plump-joy');
  document.getElementById('msg').innerText = data[cur].done;
}
function resetPlant() {
  document.getElementById('rain').setAttribute('opacity', '0');
  document.getElementById('jsmile').setAttribute('d', 'M 194 170 Q 200 174 206 170');
  document.getElementById('joubarbe').classList.remove('plump-joy');
  document.getElementById('msg').innerText = '';
}
setLang('fr');
</script>
</body>
</html>
