<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок 1: Венерин башмачок</title>
  <style>
    body { margin: 0; padding: 16px; background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; }
    h2 { color: #fde047; font-size: 20px; margin: 0 0 12px; }
    canvas { background: #1e293b; border: 2px solid #334155; border-radius: 16px; max-width: 100%; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
    button { padding: 14px 18px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; }
    .b1 { background: #facc15; color: #0f172a; }
    .b2 { background: #38bdf8; color: #0f172a; }
    .b3 { background: #475569; color: #fff; }
    #msg { background: #1e293b; border-left: 4px solid #facc15; padding: 12px; border-radius: 8px; max-width: 440px; margin: 0 auto; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>🌸 Урок 1: Ловушка Венерина башмачка</h2>
  <canvas id="c" width="420" height="320"></canvas>
  <div class="btns">
    <button class="b1" onclick="goBee()">🐝 1. Запустить шмеля</button>
    <button class="b2" onclick="goLight()">💡 2. Световой маяк</button>
    <button class="b3" onclick="reset()">🔄 Сброс</button>
  </div>
  <div id="msg">Нажми «Запустить шмеля», чтобы проверить, как работает скользкая ловушка цветка.</div>

<script>
  const ctx = document.getElementById('c').getContext('2d');
  const msg = document.getElementById('msg');
  let state = 'idle', light = false, p = 0, bee = { x: 70, y: 50, pollen: false };

  function goBee() {
    bee = { x: 70, y: 50, pollen: false };
    state = 'fall'; p = 0;
    msg.innerText = '🐝 Шмель прилетел на запах, поскользнулся на восковом крае и упал внутрь!';
  }

  function goLight() {
    light = !light;
    if (light && state === 'trap') {
      state = 'climb'; p = 0;
      msg.innerText = '💡 Свет включён! Шмель увидел прозрачные окошки и ползёт к выходу мимо пыльцы!';
    }
  }

  function reset() {
    state = 'idle'; light = false; p = 0; bee = { x: 70, y: 50, pollen: false };
    msg.innerText = 'Опыт сброшен. Нажми «Запустить шмеля».';
  }

  function loop() {
    ctx.clearRect(0, 0, 420, 320);

    // Стебель и лепестки
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(210, 320); ctx.lineTo(210, 120); ctx.stroke();

    ctx.fillStyle = '#7f1d1d';
    ctx.beginPath(); ctx.moveTo(210, 125); ctx.quadraticCurveTo(100, 100, 40, 160); ctx.quadraticCurveTo(120, 130, 210, 140); ctx.fill();
    ctx.beginPath(); ctx.moveTo(210, 125); ctx.quadraticCurveTo(320, 100, 380, 160); ctx.quadraticCurveTo(300, 130, 210, 140); ctx.fill();
    ctx.beginPath(); ctx.moveTo(210, 125); ctx.quadraticCurveTo(180, 40, 210, 20); ctx.quadraticCurveTo(240, 40, 210, 125); ctx.fill();

    // Световой маяк
    if (light) {
      ctx.fillStyle = 'rgba(253, 224, 71, 0.45)';
      ctx.beginPath(); ctx.arc(270, 130, 55, 0, Math.PI * 2); ctx.fill();
    }

    // Пыльца
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(250, 138, 8, 0, Math.PI * 2); ctx.fill();

    // Жёлтая губа-ловушка
    ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
    ctx.beginPath();
    ctx.moveTo(160, 145);
    ctx.bezierCurveTo(120, 200, 140, 280, 210, 280);
    ctx.bezierCurveTo(280, 280, 300, 190, 260, 130);
    ctx.lineTo(235, 135);
    ctx.quadraticCurveTo(240, 165, 205, 165);
    ctx.closePath(); ctx.fill();

    // Движение шмеля
    if (state === 'fall') {
      p += 0.02; bee.x = 70 + p * 140; bee.y = 50 + p * 180;
      if (p >= 1) {
        state = 'trap';
        msg.innerText = '⚠️ Шмель в ловушке! Стенки скользкие. Нажми «Световой маяк», чтобы показать выход.';
      }
    } else if (state === 'trap') {
      bee.x = 210 + Math.sin(Date.now() / 120) * 15; bee.y = 230;
      if (light) { state = 'climb'; p = 0; }
    } else if (state === 'climb') {
      p += 0.015; bee.x = 210 + p * 60; bee.y = 230 - p * 100;
      if (p > 0.5) bee.pollen = true;
      if (p >= 1) {
        state = 'done';
        msg.innerText = '✅ Готово! Шмель вылетел с пыльцой на спинке без единой капли нектара!';
      }
    } else if (state === 'done') {
      bee.x += 1.5; bee.y -= 0.7;
      if (bee.x > 440) bee.x = 290;
    }

    // Рисуем шмеля
    ctx.save(); ctx.translate(bee.x, bee.y);
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.fillRect(-5, -7, 4, 14); ctx.fillRect(2, -7, 4, 14);
    if (bee.pollen) { ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.arc(0, -8, 5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();

    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
