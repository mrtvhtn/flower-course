<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок 13: Царица ночи (Селеницереус)</title>
  <style>
    body { margin: 0; padding: 14px; background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; }
    .langs { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .langs button { padding: 6px 14px; font-size: 13px; border-radius: 20px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .langs button.active { background: #a855f7; color: #fff; border-color: #a855f7; }
    h2 { color: #c084fc; font-size: 19px; margin: 0 0 10px; }
    canvas { border: 2px solid #475569; border-radius: 16px; max-width: 100%; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
    .btns button { padding: 12px 14px; font-size: 14px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; }
    .b1 { background: #a855f7; color: #fff; }
    .b2 { background: #fde047; color: #0f172a; }
    .b3 { background: #475569; color: #fff; }
    #msg { background: #1e293b; border-left: 4px solid #a855f7; padding: 12px; border-radius: 8px; max-width: 440px; margin: 0 auto; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="langs">
    <button id="l-ru" class="active" onclick="setLang('ru')">🇷🇺 RU</button>
    <button id="l-fr" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="l-en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
  <h2 id="title">🌙 Урок 13: Царица ночи</h2>
  <canvas id="c" width="420" height="310"></canvas>
  <div class="btns">
    <button class="b1" id="btn1" onclick="setNight()">🌙 Включить ночь (Раскрыть)</button>
    <button class="b2" id="btn2" onclick="callMoth()">🦋 Позвать ночного бражника</button>
    <button class="b3" id="btn3" onclick="reset()">☀️ День (Сброс)</button>
  </div>
  <div id="msg">Днём в пустыне слишком жарко, и бутон Царицы ночи крепко закрыт. Дождись темноты!</div>

<script>
  const T = {
    ru: {
      title: '🌙 Урок 13: Царица ночи',
      b1: '🌙 Включить ночь (Раскрыть)', b2: '🦋 Позвать ночного бражника', b3: '☀️ День (Сброс)',
      idle: 'Днём в пустыне слишком жарко, и бутон Царицы ночи крепко закрыт. Дождись темноты!',
      night: '🌸 Наступила ночь! Царица ночи раскрыла белоснежные лепестки и выпустила сладкий аромат ванили.',
      moth: '🦋 Ночной бражник почуял аромат в темноте, прилетел за нектаром и перенёс пыльцу!'
    },
    fr: {
      title: '🌙 Leçon 13 : La Reine de la Nuit',
      b1: '🌙 Activer la nuit (Éclore)', b2: '🦋 Appeler le papillon de nuit', b3: '☀️ Jour (Réinitialiser)',
      idle: 'Le jour dans le désert, il fait trop chaud : le bouton reste fermé. Attends la nuit !',
      night: '🌸 La nuit tombe ! La Reine de la Nuit ouvre ses pétales blancs et diffuse un parfum de vanille.',
      moth: '🦋 Attiré par le parfum dans l’obscurité, le sphinx butine le nectar et pollinise la fleur !'
    },
    en: {
      title: '🌙 Lesson 13: Queen of the Night',
      b1: '🌙 Switch to Night (Bloom)', b2: '🦋 Call Sphinx Moth', b3: '☀️ Day (Reset)',
      idle: 'During the hot desert day, the Queen of the Night keeps its bud tightly closed. Wait for dark!',
      night: '🌸 Night falls! The flower opens its giant white petals and releases a sweet vanilla scent.',
      moth: '🦋 Guided by scent in the dark, the night moth drinks nectar and pollinates the bloom!'
    }
  };

  let lang = 'ru', isNight = false, bloom = 0, mothActive = false, t = 0;
  const ctx = document.getElementById('c').getContext('2d');
  const msg = document.getElementById('msg');

  function setLang(l) {
    lang = l;
    ['ru','fr','en'].forEach(k => document.getElementById('l-'+k).className = (k===l?'active':''));
    document.getElementById('title').innerText = T[l].title;
    document.getElementById('btn1').innerText = T[l].b1;
    document.getElementById('btn2').innerText = T[l].b2;
    document.getElementById('btn3').innerText = T[l].b3;
    msg.innerText = T[l][!isNight ? 'idle' : mothActive ? 'moth' : 'night'];
  }

  function setNight() { isNight = true; msg.innerText = T[lang].night; }
  function callMoth() { if (isNight) { mothActive = true; msg.innerText = T[lang].moth; } }
  function reset() { isNight = false; bloom = 0; mothActive = false; msg.innerText = T[lang].idle; }

  function loop() {
    t += 0.04;
    if (isNight && bloom < 1) bloom += 0.03;

    // Фон неба и песок
    ctx.fillStyle = isNight ? '#090d16' : '#38bdf8';
    ctx.fillRect(0, 0, 420, 250);
    ctx.fillStyle = isNight ? '#451a03' : '#d97706';
    ctx.fillRect(0, 250, 420, 60);

    // Солнце или Луна со звёздами
    if (isNight) {
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(345, 55, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      [[60,40],[140,70],[250,35],[300,90]].forEach(s => ctx.fillRect(s[0], s[1], 3, 3));
    } else {
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(345, 55, 24, 0, Math.PI * 2); ctx.fill();
    }

    // Стебель кактуса
    ctx.fillStyle = '#15803d';
    ctx.fillRect(198, 175, 24, 75);

    // Цветок Царицы ночи (x = 210, y = 155)
    const petals = 12;
    for (let i = 0; i < petals; i++) {
      const ang = (i / petals) * Math.PI * 2;
      const spread = 12 + bloom * 34;
      const px = 210 + Math.cos(ang) * spread;
      const py = 155 + Math.sin(ang) * spread * 0.75;
      ctx.fillStyle = bloom > 0.2 ? '#f8fafc' : '#86efac';
      ctx.beginPath(); ctx.arc(px, py, 12 + bloom * 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = bloom > 0.3 ? '#fde047' : '#22c55e';
    ctx.beginPath(); ctx.arc(210, 155, 14 + bloom * 5, 0, Math.PI * 2); ctx.fill();

    // Волны ванильного аромата ночью
    if (isNight && bloom > 0.5) {
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.45)';
      ctx.lineWidth = 2;
      for (let r = 1; r <= 3; r++) {
        ctx.beginPath();
        ctx.arc(210, 155, 45 + r * 22 + Math.sin(t) * 5, Math.PI, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Ночной бражник
    if (mothActive) {
      const mx = 210 + Math.cos(t * 1.4) * 65;
      const my = 115 + Math.sin(t * 2) * 18;
      ctx.fillStyle = '#e879f9';
      ctx.beginPath(); ctx.ellipse(mx - 10, my, 12, 6, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(mx + 10, my, 12, 6, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#fef3c7'; ctx.font = '12px sans-serif';
    ctx.fillText('Selenicereus — Царица ночи', 135, 285);

    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
