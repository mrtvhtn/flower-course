<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок 14: Одуванчик и Альсомитра</title>
  <style>
    body { margin: 0; padding: 14px; background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; }
    .langs { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .langs button { padding: 6px 14px; font-size: 13px; border-radius: 20px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .langs button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    h2 { color: #38bdf8; font-size: 19px; margin: 0 0 10px; }
    canvas { background: linear-gradient(180deg, #0ea5e9 0%, #1e293b 82%, #14532d 82%); border: 2px solid #475569; border-radius: 16px; max-width: 100%; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
    .btns button { padding: 12px 14px; font-size: 14px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; }
    .b1 { background: #f8fafc; color: #0f172a; }
    .b2 { background: #facc15; color: #0f172a; }
    .b3 { background: #475569; color: #fff; }
    #msg { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 8px; max-width: 440px; margin: 0 auto; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="langs">
    <button id="l-ru" class="active" onclick="setLang('ru')">🇷🇺 RU</button>
    <button id="l-fr" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="l-en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
  <h2 id="title">🪂 Урок 14: Семена-парашютисты и планеры</h2>
  <canvas id="c" width="420" height="310"></canvas>
  <div class="btns">
    <button class="b1" id="btn1" onclick="blowDandelion()">🌬 Подуть на одуванчик</button>
    <button class="b2" id="btn2" onclick="launchGlider()">🛩 Запустить планер Альсомитры</button>
    <button class="b3" id="btn3" onclick="reset()">🔄 Сброс</button>
  </div>
  <div id="msg">Чтобы не мешать родителям, семена освоили полёт. Запусти парашютик и планер!</div>

<script>
  const T = {
    ru: {
      title: '🪂 Урок 14: Семена-парашютисты и планеры',
      b1: '🌬 Подуть на одуванчик', b2: '🛩 Запустить планер Альсомитры', b3: '🔄 Сброс',
      idle: 'Чтобы не мешать родителям, семена освоили полёт. Запусти парашютик и планер!',
      dand: '🌬 Парашютик одуванчика (паппус) создаёт воздушный вихрь и может улететь на десятки километров!',
      glid: '🛩 Крылатое семя Альсомитры плавно скользит по воздуху как настоящий самолёт-бесхвостка!'
    },
    fr: {
      title: '🪂 Leçon 14 : Graines Parachutes et Planeurs',
      b1: '🌬 Souffler sur le pissenlit', b2: '🛩 Lancer le planeur Alsomitra', b3: '🔄 Réinitialiser',
      idle: 'Pour voyager loin, les graines ont inventé le vol. Lance le parachute et le planeur !',
      dand: '🌬 L’aigrette du pissenlit crée un mini-tourbillon d’air et flotte sur des kilomètres !',
      glid: '🛩 La graine ailée de l’Alsomitra plane doucement dans les airs comme une aile volante !'
    },
    en: {
      title: '🪂 Lesson 14: Parachute & Glider Seeds',
      b1: '🌬 Blow Dandelion', b2: '🛩 Launch Alsomitra Glider', b3: '🔄 Reset',
      idle: 'To travel far from parent plants, seeds mastered flight. Launch the parachute and glider!',
      dand: '🌬 The dandelion pappus creates a tiny air vortex, allowing it to float for miles!',
      glid: '🛩 Alsomitra’s winged seed glides smoothly through the air like a flying-wing aircraft!'
    }
  };

  let lang = 'ru', seeds = [], gliders = [];
  const ctx = document.getElementById('c').getContext('2d');
  const msg = document.getElementById('msg');

  function setLang(l) {
    lang = l;
    ['ru','fr','en'].forEach(k => document.getElementById('l-'+k).className = (k===l?'active':''));
    document.getElementById('title').innerText = T[l].title;
    document.getElementById('btn1').innerText = T[l].b1;
    document.getElementById('btn2').innerText = T[l].b2;
    document.getElementById('btn3').innerText = T[l].b3;
    msg.innerText = T[l].idle;
  }

  function blowDandelion() {
    msg.innerText = T[lang].dand;
    for (let i = 0; i < 6; i++) {
      seeds.push({
        x: 95 + (Math.random() - 0.5) * 16,
        y: 165 + (Math.random() - 0.5) * 16,
        vx: 1.2 + Math.random() * 1.4,
        vy: -0.7 - Math.random() * 0.8,
        phase: Math.random() * 6
      });
    }
  }

  function launchGlider() {
    msg.innerText = T[lang].glid;
    gliders.push({ x: 35, y: 65, vx: 2.2, phase: 0 });
  }

  function reset() {
    seeds = []; gliders = [];
    msg.innerText = T[lang].idle;
  }

  function loop() {
    ctx.clearRect(0, 0, 420, 310);

    // Стебель и пушистая шапка одуванчика (x = 95, y = 175)
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(95, 255); ctx.lineTo(95, 180); ctx.stroke();

    ctx.fillStyle = 'rgba(248, 250, 252, 0.85)';
    ctx.beginPath(); ctx.arc(95, 175, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.beginPath(); ctx.arc(95, 175, 7, 0, Math.PI * 2); ctx.fill();

    // Летящие парашютики одуванчика
    seeds.forEach(s => {
      s.phase += 0.08;
      s.x += s.vx;
      s.y += s.vy + Math.sin(s.phase) * 0.6;
      if (s.y < 35) s.vy = 0.15;

      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - 12);
      ctx.moveTo(s.x - 8, s.y - 17); ctx.lineTo(s.x, s.y - 12); ctx.lineTo(s.x + 8, s.y - 17);
      ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
    });
    seeds = seeds.filter(s => s.x < 440 && s.y < 252);

    // Планеры Альсомитры
    gliders.forEach(g => {
      g.phase += 0.06;
      g.x += g.vx;
      g.y += 0.55 + Math.sin(g.phase) * 0.45;

      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(Math.sin(g.phase) * 0.12);
      ctx.fillStyle = 'rgba(254, 249, 195, 0.9)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#92400e';
      ctx.beginPath(); ctx.arc(4, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    gliders = gliders.filter(g => g.x < 450 && g.y < 250);

    ctx.fillStyle = '#e2e8f0'; ctx.font = '12px sans-serif';
    ctx.fillText('Taraxacum (Одуванчик) & Alsomitra (Альсомитра)', 65, 285);

    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
